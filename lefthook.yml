# Git hooks for Downshift, run by lefthook (pinned in go.mod as a tool).
# Install once: make hooks. Skip one run: LEFTHOOK=0 before the git command.
# The hooks and `make check` check only what a change touches; `make check-full` runs everything.
#   pre-commit: format, then vet, staticcheck and tests of the staged Go packages.
#   pre-push:   make check (gofmt, vet host/windows/linux and tests of the packages
#               changed since origin/main and their dependents, selected by
#               scripts/ci-test-packages.sh like CI), then the mod's tests when
#               mods/ changed. make check shares its green stamp with a manual run,
#               so a tree that already passed is not checked twice.
# Commands mirror the CI gates in .github/workflows/ci.yml; keep them in step.

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      # The toolchain's gofmt (go.mod), not the first one on PATH: an older
      # gofmt would rewrite files into a form CI rejects.
      run: '"$(go env GOROOT)/bin/gofmt" -w {staged_files}'
      stage_fixed: true
    vet:
      glob: "*.go"
      run: make -s vet-staged
    staticcheck:
      glob: "*.go"
      run: make -s staticcheck-staged
    tests:
      glob: "*.go"
      run: make test-staged

pre-push:
  piped: true # stop at the first failure: no mod tests when make check already failed
  commands:
    check:
      run: make -s check
    test-mods:
      run: make test-mods

# Installing the hooks is explicit (make hooks); a run must not write into .git/hooks,
# which is shared by every worktree of the clone.
no_auto_install: true
